name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Distribution
        run: |
          mkdir -p apk-distribution
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerospace-app-debug-apk
          path: apk-distribution/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" apk-distribution/app-debug.apk apk-distribution/app-debug.apk.sha256 \
            --title "AEROSPACE Release $TAG_NAME" \
            --notes "Unduh langsung file APK Android game AEROSPACE siap pakai." \
            --latest
