name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Game
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Distribution
        run: |
          mkdir -p apk-distribution
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "APK_SIZE=$(wc -c < app-debug.apk | tr -d ' ')" >> $GITHUB_ENV
          echo "APK_SHA=$(sha256sum app-debug.apk | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerospace-app-debug-apk
          path: apk-distribution/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="AEROSPACE v1.0.${{ github.run_number }} (Android APK)"
          
          gh release create "$TAG_NAME" apk-distribution/app-debug.apk apk-distribution/app-debug.apk.sha256 \
            --title "$RELEASE_TITLE" \
            --notes "## 🚀 AEROSPACE - Android APK Release

**Versi Build:** \`$TAG_NAME\` (Run #${{ github.run_number }})
**Ukuran APK:** \`${{ env.APK_SIZE }} bytes\`
**SHA-256:** \`${{ env.APK_SHA }}\`

### 📥 Link Download Langsung:
👉 [**Download app-debug.apk**](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)

---
### 📱 Cara Pasang di HP Android:
1. Klik tautan download di atas menggunakan browser di ponsel Android Anda.
2. Buka file \`app-debug.apk\` yang telah diunduh.
3. Jika muncul peringatan, pilih **Izinkan instalasi dari sumber tidak dikenal / browser**.
4. Ketuk **Instal**, lalu mainkan game **AEROSPACE**!" \
            --latest

      - name: Generate Build Summary
        run: |
          echo "### 🚀 APK Android Berhasil Dibuat & Dipublikasikan!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Game:** AEROSPACE" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`v1.0.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ukuran APK:** \`${{ env.APK_SIZE }} bytes\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${{ env.APK_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Link Download Langsung:** [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **Halaman Release:** [GitHub Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
